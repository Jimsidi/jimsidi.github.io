<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400&display=swap');

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0e0f0e;
        color: #e8ebe8;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      .container {
        max-width: 480px;
      }

      .code {
        font-family: 'Space Mono', monospace;
        font-size: 6rem;
        font-weight: 700;
        color: #4a7c5f;
        line-height: 1;
        margin-bottom: 1.5rem;
      }

      .title {
        font-family: 'Space Mono', monospace;
        font-size: 1.25rem;
        color: #e8ebe8;
        margin-bottom: 1rem;
      }

      .message {
        font-size: 0.95rem;
        color: #9aa89a;
        line-height: 1.7;
        margin-bottom: 2.5rem;
      }

      .link {
        font-family: 'Space Mono', monospace;
        font-size: 0.8rem;
        color: #0e0f0e;
        background: #4a7c5f;
        border: 1px solid #4a7c5f;
        padding: 0.75rem 1.75rem;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.2s ease;
      }

      .link:hover {
        background: #3d6b4f;
        border-color: #3d6b4f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1 class="title">Page Not Found</h1>
      <p class="message">
        The page you are looking for does not exist or has been moved.
      </p>
      <a href="https://jimsidi.github.io" class="link">Go back home</a>
    </div>
  </body>
</html>
